name: CI/CD

# Пайплайн запускается на каждый push и pull request в main.
# Джоб quality (линт → типы → тесты → сборка) — «ворота качества»:
# деплой не начнётся, пока он не прошёл.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Линтинг, тесты, сборка
    runs-on: ubuntu-latest
    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Аудит безопасности зависимостей (prod)
        run: npm audit --omit=dev || true

      - name: Линтинг
        run: npm run lint

      - name: Проверка форматирования
        run: npm run format:check

      - name: Проверка типов
        run: npm run typecheck

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_YM_ID: ${{ secrets.VITE_YM_ID }}

  deploy:
    name: Деплой на Vercel
    needs: quality            # деплой только после успешного quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Установка Vercel CLI
        run: npm install -g vercel@latest

      - name: Подтягиваем настройки окружения Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Сборка проекта на Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Деплой в production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
