name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Линтинг, тесты, сборка
    runs-on: ubuntu-latest
    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установка зависимостей
        run: npm install

      - name: Аудит production-зависимостей
        run: npm audit --omit=dev || true

      - name: Линтинг
        run: npm run lint


      - name: Проверка типов
        run: npm run typecheck

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_YM_ID: ${{ secrets.VITE_YM_ID }}
